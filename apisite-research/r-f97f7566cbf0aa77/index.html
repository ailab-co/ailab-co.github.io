<h3>站点（${N.sites.length}）</h3><div class="tw"><table><thead><tr><th>站点</th><th>状态</th><th>总分</th><th>证据摘录</th><th>电报</th></tr></thead><tbody>${N.sites.sort((a,b)=>(a.s>b.s?1:-1)).map(x=>`<tr><td>${SN(x.id,x.n)}<br><span class="small">${SD(x.id,x.d)}</span>${x.ex?' <span class="tag u">已排除</span>':''}</td><td>${ns(x.s)}</td><td class="num">${f(x.tot,1)}</td><td class="small">${x.ev.map(e=>`<b>${esc(e.k)}</b>：${esc(e.v)}`).join('<br>')}</td><td class="small">${tgs(x.tg)}</td></tr>`).join('')}</tbody></table></div>

// ---------- 6 ----------
const G=D.graph.slice().sort((a,b)=>(b.tot||0)-(a.tot||0));
$('#graph').innerHTML=`<p class="muted">卖家/联系人 → 站点 → 站内分组。只列公开 t.me 链接；“已核验”=资料页与站点互证，“页面列出”=站点自己页面上的链接，“未证实”=群内/报告线索。</p>
<div class="filters"><input id="gq" placeholder="搜索电报 / 站点 / 分组…"></div>
<div class="tw" style="max-height:70vh"><table><thead><tr><th>电报</th><th>类型</th><th>核验</th><th>站点</th><th>总分</th><th>站内分组（前 6）</th></tr></thead><tbody id="gb"></tbody></table></div>
<h3>电报群报价线索（${D.tgq.length}）</h3><div class="tw" style="max-height:60vh"><table><thead><tr><th>批次</th><th>群/卖家</th><th>模型</th><th>报价原文</th><th>口径</th><th>归属站点</th></tr></thead><tbody>${D.tgq.map(t=>`<tr><td>${t.b}</td><td class="small">${esc(t.s)}</td><td class="small">${esc(t.m||'')}</td><td class="small">${esc(t.q||'')}</td><td class="small">${esc(t.c||'')}</td><td class="small">${t.sid?SN(t.sid):'—'}</td></tr>`).join('')}</tbody></table></div>`;
const VF={verified:'<span class="tag y">已核验</span>',page_listed:'<span class="tag">页面列出</span>',unverified:'<span class="tag u">未证实</span>'};
function gdraw(){const q=$('#gq').value.toLowerCase();$('#gb').innerHTML=G.filter(g=>!q||[g.u,g.sn,g.d,g.g.join(' '),g.dn].join(' ').toLowerCase().includes(q)).map(g=>`<tr><td class="small">${lk(g.u,g.u.replace('https://',''))}</td><td class="small">${esc(g.k||'')}</td><td>${VF[g.v]||''}</td><td>${g.sid?SN(g.sid,g.sn):esc(g.sn)}<br><span class="small">${g.sid?SD(g.sid,g.d):''}</span></td><td class="num">${f(g.tot,1)}</td><td class="small">${g.g.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</td></tr>`).join('');}
$('#gq').addEventListener('input',gdraw);gdraw();
// ---------- 7 ----------
const FT={payment:'付款',terms:'条款',reliability:'可靠性',icp:'ICP',company:'主体',whois:'WHOIS',nsfw:'NSFW',signal:'信号',region:'地域'};
$('#cards').innerHTML=D.cards.map(c=>{const s=SM[c.id];return `<div class="box card" id="c-${esc(c.id)}"><span class="sc">${f(s.tot,1)}</span><h4>#${s.rk} ${s.u?lk(s.u,s.n):esc(s.n)}</h4>
<div class="small">${s.u?lk(s.u,s.d||host(s.u)):''} · ${TY[s.ty]||s.ty} · ${RG[s.rg]||s.rg}${s.sw?' · '+esc(s.sw):''}</div>
<div class="subs"><div>可靠<b>${f(s.r,1)}/30</b></div><div>价格<b>${f(s.p,1)}/30</b></div><div>规模<b>${f(s.sc,1)}/15</b></div><div>付款<b>${f(s.pay,1)}/15</b></div><div>合规<b>${f(s.cm,1)}/10</b></div></div>
<div class="small">域名注册 ${esc(s.wc||'—')} · 服务器 ${esc(s.ipc||'?')}${s.cdn==='yes'?'（CDN）':''} · ICP ${esc(s.icp||'未见')}${s.co?' · 主体 '+esc(s.co):''}</div>
<div class="small">地域依据：${esc(s.rb||'—')}</div>
<div class="small" style="margin:4px 0">支付宝${yn(s.ali)} 微信${yn(s.wx)} USDT${yn(s.usdt)} 人民币${yn(s.rmb)} 发票${yn(s.inv)} NSFW${ns(s.nsfw)}</div>
${s.tg.length?`<div class="small">电报：${s.tg.map(x=>lk(x.u,x.u.replace('https://',''))).join('、')}</div>`:''}
<div class="small"><b>报价来源</b>：${SRCS(s.src)}</div>
${c.adv&&c.adv.length?`<div class="small"><b>优势模型</b>：${c.adv.map(x=>`<span class="tag${x.w?' c':' y'}">${esc(MN[x.m]||x.m)} ${cny(x.v)} · 第${x.rk}/${x.n} · 中位数 ${Math.round((x.xm||0)*100)}%</span>`).join(' ')}</div>`:''}
${c.cheap.length?`<div class="small"><b>排名靠前的报价</b><ol class="tight">${c.cheap.map(p=>`<li>${esc(p.m)} ${cny(p.v)} ${tier(p.t)} 层内第 ${p.rk} ${disc(p.x)} <span class="muted">${esc(p.g||'')}</span></li>`).join('')}</ol></div>`:''}
<details><summary class="small">证据（${c.facts.length}）· 报价 ${c.nprice} 条</summary><div class="small">${c.facts.map(x=>`<div><span class="tag">${FT[x.t]||x.t}</span>${esc(x.k||'')}：${esc(x.v||'')} ${x.u?lk(x.u,'↗'):''}</div>`).join('')}</div></details></div>`;}).join('');
// ---------- 8 ----------
const RK={};D.risks.forEach(r=>(RK[r.k]=RK[r.k]||[]).push(r));
$('#risk').innerHTML=`<div class="note warn"><b>重点：</b>名称仿冒官方的电报号（如 AntropicSupport / AntropicAll_bot，不是 Anthropic 官方）不要接触；B 层超低价多为 ¥1=$1 或充值比异常，先小额实测再放量；大部分站点域名都是 2026 年新注册，注意跑路风险，余额不要囤太多。</div>
${Object.entries(RK).map(([k,a])=>`<details${k!=='新域名'?' open':''}><summary>${esc(k)}（${a.length}）</summary><div class="tw"><table><thead><tr><th>站点</th><th>域名</th><th>总分</th><th>说明</th></tr></thead><tbody>${a.sort((x,y)=>(y.tot||0)-(x.tot||0)).map(r=>`<tr><td>${SN(r.id,r.n)}</td><td>${SD(r.id,r.d)||'—'}</td><td class="num">${f(r.tot,1)}</td><td class="small">${esc(r.v)}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}
<h3>各模型前 5 里的 B 层超低价（需实测）</h3><div class="tw"><table><thead><tr><th>模型</th><th>站点</th><th>价格</th><th>相对官方</th><th>报价来源</th></tr></thead><tbody>${D.bcheap.map(b=>`<tr><td>${esc(b.m)}</td><td>${SN(b.sid,b.n)}<br><span class="small">${SD(b.sid,b.d)}</span></td><td class="num">${cny(b.v)}</td><td>${disc(b.x)}</td><td class="small">${SRC1(b.src)}</td></tr>`).join('')}</tbody></table></div>`;
// ---------- 9 ----------
const C=D.cov;
$('#gaps').innerHTML=`<ul>
<li>数据来源：v11 调研包（官网/匿名 /api/pricing、登录后市场挂牌、电报群 4 个批次、V2EX/X 等社区）＋ 2026-11-16 对前 ${C.sites} 个中转站的公开补充（DNS、IP 归属、WHOIS、首页及匿名公开接口）。没有注册、付款或私聊。</li>
<li>补充覆盖（前 ${C.sites} 站）：WHOIS ${C.whois}、IP ${C.ip}、页面抓取 ${C.page_fetched}、站点展示 ICP ${C.icp}、公司主体 ${C.company}、付款方式有依据 ${C.payment_any}（支付宝 ${C.alipay}、微信 ${C.wechat}、USDT ${C.usdt}）、可开票 ${C.invoice}。其余站点只有 v11 字段，付款/NSFW 多为“未知”。</li>
<li><b>“未知”不等于“不支持”</b>：很多 new-api 站付款方式要登录后才看得到。</li>
<li>ICP：第三方查询站需要验证码，只认站点页面自己展示的备案号；“国内”地域多为推断（.cn 实名或国内注册商），依据写在每站“地域依据”。</li>
<li>WHOIS 隐私保护普遍，公司主体极少；个人注册人信息一律不展示。</li>
<li>价格：全部是页面标价换算，未实付（换算规则和审计见 §4B）；LLM 官方基准多为各站众数推定；视频按 5 秒 720p，图片多数未声明分辨率/质量。</li>
<li>价格分在总分中占比大，便宜的新站可能排得靠前，请结合可靠性分看。</li>
<li>库内统计：站点 ${D.counts.sites}、报价 ${D.counts.prices}、来源 ${D.counts.sources}、联系人 ${D.counts.contacts}、事实 ${D.counts.site_facts}。</li></ul>`;

$('#appx').innerHTML=`<h3>排除排名的大平台/官方/自有（${D.excluded.length}）</h3><div class="tw"><table><thead><tr><th>名称</th><th>网址</th><th>原因</th></tr></thead><tbody>${D.excluded.map(x=>`<tr><td>${SN(x.id,x.n)}</td><td class="small">${SD(x.id,x.d)}</td><td class="small">${esc(x.r||'')}</td></tr>`).join('')}</tbody></table></div>
<h3>无官网 / 不可达 / 空壳（已评分但信息很少，${D.nodomain.length}）</h3><div class="tw"><table><thead><tr><th>名称</th><th>状态</th><th>总分</th><th>电报</th></tr></thead><tbody>${D.nodomain.map(x=>`<tr><td>${SN(x.id,x.n)}${x.d?'<br><span class="small">'+SD(x.id,x.d)+'</span>':''}</td><td>${esc({no_website:'无官网',unreachable:'不可达',shell:'空壳',dead:'失效'}[x.st]||x.st)}</td><td class="num">${f(x.tot,1)}</td><td class="small">${tgs(x.tg)}</td></tr>`).join('')}</tbody></table></div>`;
document.body.setAttribute('data-ready','1');
})();
